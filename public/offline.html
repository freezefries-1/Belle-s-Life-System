<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101827" />
    <title>Offline · belle’s life system</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f8fafc; color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      .mark { width: 48px; height: 48px; margin: 0 auto 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #475569; margin: 0 0 20px; }
      button { font: inherit; font-weight: 600; font-size: 15px; color: #fff; background: #2563eb; border: 0; border-radius: 10px; padding: 12px 20px; min-height: 44px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon-192.png" alt="" width="48" height="48" />
      <h1>You’re offline</h1>
      <p>belle’s life system needs a connection to load your data. Nothing has been lost — changes you made are kept on this device until you’re back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
